<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bottito Bot – Pump.fun Token Alerts & Telegram Channel Poster</title>
  <meta name="description" content="Bottito is a Telegram bot that tracks Pump.fun tokens in real-time, sends rich alerts, manages paid subscriptions, and lets you auto‑post token info to your channels. 14‑day free trial." />
  <link rel="canonical" href="https://bottito.example.com/" />

  <!-- Open Graph / Twitter SEO -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Bottito Bot – Pump.fun Token Alerts & Telegram Channel Poster" />
  <meta property="og:description" content="Get real-time Pump.fun token alerts, referral rewards, and one-click channel posting. Try Bottito with a 14‑day free trial." />
  <meta property="og:image" content="https://www.bottito.fun{{ url_for('static', filename='icon.jpg') }}" />
  <meta property="og:url" content="https://www.bottito.fun/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Bottito Bot – Pump.fun Token Alerts & Telegram Channel Poster" />
  <meta name="twitter:description" content="Real-time Pump.fun alerts, free/month + make money." />
  <meta name="twitter:image" content="https://www.bottito.fun{{ url_for('static', filename='icon.jpg') }}" />

  <!-- Favicon -->
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root { --brand: #7c6cff; --brand-2: #00d1ff; }
    body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji"; }
    .gradient-hero { background: radial-gradient(1200px 800px at 10% -10%, rgba(124,108,255,.25), rgba(0,0,0,0)),
                                 radial-gradient(800px 600px at 90% 10%, rgba(0,209,255,.20), rgba(0,0,0,0)); }
    .hero-badge { background: rgba(124,108,255,.15); border:1px solid rgba(124,108,255,.3); }
    .card { border: 1px solid rgba(255,255,255,.08); }
    .icon-bubble { width: 44px; height: 44px; display:grid; place-items:center; border-radius:12px; background: rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); }
    .section-pt { padding-top: 5rem; } .section-pb { padding-bottom: 5rem; }
    .btn-brand { background: linear-gradient(135deg, var(--brand), var(--brand-2)); border: none; }
    .btn-brand:hover { opacity: .95; }
    .blur { backdrop-filter: blur(10px); }
    .list-icon li { margin-bottom:.6rem; }
    .list-icon i { opacity:.9; }
    .nav-link { color:#d7d7ff; }
    .nav-link:hover { color:white; }
    .shadow-soft { box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    a[href^="https://t.me/"] .bi-telegram { transform: translateY(2px); }
  </style>

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Bottito Bot",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Telegram",
    "description": "Telegram bot that tracks Pump.fun tokens, sends alerts, manages subscriptions, and auto‑posts token info to channels.",
    "offers": {"@type": "Offer", "price": "free", "priceCurrency": "SOL"},
    "url": "https://t.me/bottito_search_bot",
    "aggregateRating": {"@type": "AggregateRating", "ratingValue": "4.9", "reviewCount": "127"}
  }
  </script>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
