<!DOCTYPE html>
<html>
<head>
    <title>Promoter - Payment Link</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Load latest Web3.js (v4.x) from jsDelivr CDN -->
    <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
    <style>
        /* General styles for a macOS-inspired look */
        body {
            background-color: #f5f5f7; /* Light grey background similar to macOS */
            color: #333; /* Dark text for good contrast */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding-top: 80px; /* Adjust for the fixed navigation bar */
            margin: 0;
        }

        .container {
            max-width: 900px;
            margin-top: 20px;
            padding: 20px;
            background-color: #fff;
            border-radius: 12px; /* Rounded corners for a smooth look */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); /* Subtle shadow for depth */
        }

        .navbar {
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0; /* Subtle border for separation */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05); /* Light shadow */
        }

        .navbar-brand {
            font-weight: 500;
            color: #007aff; /* macOS blue accent color */
        }

        .navbar-brand:hover {
            color: #0056b3; /* Darker blue on hover */
        }

        .nav-link {
            color: #333;
            font-weight: 500;
            margin-right: 15px;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: #007aff; /* Blue accent on hover */
        }

        .input-group-text {
            background-color: #f5f5f7;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .form-control {
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .btn-primary, .btn-success {
            background-color: #007aff;
            border-color: #007aff;
            border-radius: 8px;
            font-weight: 500;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .btn-primary:hover, .btn-success:hover {
            background-color: #0056b3;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3); /* Hover effect */
        }

        .alert {
            border-radius: 8px;
        }

        h2 {
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
